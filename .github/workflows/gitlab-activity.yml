name: GitLab activity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # GitLab dates the calendar in the profile's time zone, so "today" is counted the same way
      - name: Draw the graph
        env:
          TZ: Asia/Bangkok
        run: |
          curl -fsSL https://gitlab.com/users/GoGennady/calendar.json -o calendar.json || echo '{}' > calendar.json
          python3 scripts/gitlab_activity.py calendar.json out

      # The images live on their own branch, rewritten each time as a single commit,
      # so main keeps a clean history
      - name: Publish to the activity branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f out/activity-dark.svg ]; then
            echo "::warning::GitLab calendar is empty: turn on 'Include private contributions on my profile' in GitLab. The last graph stays"
            exit 0
          fi
          cd out
          git init -q -b activity
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "chore: update GitLab activity"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" activity

      # GitHub turns off scheduled workflows after 60 days without repository activity.
      # Re-enabling the workflow resets that timer
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/gitlab-activity.yml/enable"
